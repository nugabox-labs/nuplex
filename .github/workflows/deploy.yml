name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: nuplex-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /volume1/Develop/webapps/nuplex

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nugacloud]
    steps:
      - name: 이전 배포 커밋 조회
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [[ -f .last_deploy_commit ]]; then
            echo "PREV_DEPLOY_SHA=$(cat .last_deploy_commit)" >> "$GITHUB_ENV"
          else
            echo "PREV_DEPLOY_SHA=" >> "$GITHUB_ENV"
          fi

      # actions/checkout 을 쓰지 않고 NAS 의 기존 클론에서 직접 fetch 한다.
      # 그래서 인증이 자동으로 걸리지 않는다 — URL 에 토큰을 실어 보내는 방식만 실제로 동작한다.
      - name: 저장소 갱신 (fetch + reset --hard)
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c safe.directory="$DEPLOY_DIR" fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
          git -c safe.directory="$DEPLOY_DIR" reset --hard FETCH_HEAD

      # 새 코드가 옛 스키마 위에서 도는 시간이 생기지 않도록 restart 앞에서 적용한다.
      # 마이그레이션이 실패하면 여기서 배포가 멈춘다(옛 코드가 계속 서비스된다).
      - name: DB 마이그레이션 적용
        working-directory: ${{ env.DEPLOY_DIR }}
        run: ./compose.sh migrate

      - name: compose.sh restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: ./compose.sh restart

      - name: 이번 배포 커밋 기록
        working-directory: ${{ env.DEPLOY_DIR }}
        run: echo "${{ github.sha }}" > .last_deploy_commit

      - name: 서비스 상태 수집
        if: always()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose -f compose.yml ps > /tmp/nuplex-compose-ps.txt 2>&1 || true

      - name: 진단 정보 수집 (실패 시)
        if: failure()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: git -c safe.directory="$DEPLOY_DIR" status --short > /tmp/nuplex-deploy-diag.txt 2>&1 || true

      - name: Mattermost 알림
        if: always()
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREV_DEPLOY_SHA: ${{ env.PREV_DEPLOY_SHA }}
          COMPOSE_PS_FILE: /tmp/nuplex-compose-ps.txt
          DIAG_FILE: /tmp/nuplex-deploy-diag.txt
        run: python3 .github/mattermost_notify.py
